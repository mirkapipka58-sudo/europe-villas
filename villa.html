<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Villa | Europe Villas & Apartments</title>
  <meta name="theme-color" content="#08111f">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="villa" class="villa-page">
  <div id="preloader"><div class="pl-panel top"></div><div class="pl-panel bottom"></div><div class="pl-inner"><img class="pl-logo" src="assets/img/logo.jpg" alt=""><div class="pl-count"><span class="pl-num">0</span><small>%</small></div><div class="pl-line"><i></i></div><div class="pl-text" data-i18n="loader.text"></div></div></div>
  <div id="site-header"></div>

  <main>
    <section class="page-hero" id="villa-hero"></section>
    <div id="villa-body"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lb-img"></div>
    <button class="lb-btn lb-close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="lb-btn lb-prev" aria-label="Previous"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="lb-btn lb-next" aria-label="Next"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="lb-count"></div>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n-pt-uk.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
