<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Europe Villas & Apartments</title>
  <meta name="description" content="Luxury villa, penthouse and chalet rentals in 20 European countries. Personal concierge. Discover · Stay · Enjoy.">
  <meta name="theme-color" content="#08111f">
  <meta property="og:title" content="Europe Villas & Apartments">
  <meta property="og:image" content="assets/img/villas/salvia.jpg">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=202611222101">
</head>
<body data-page="home" data-title="meta.home">
  <div id="preloader">
    <div class="pl-panel top"></div><div class="pl-panel bottom"></div>
    <div class="pl-inner">
      <img class="pl-logo" src="assets/img/logo.jpg" alt="">
      <div class="pl-count"><span class="pl-num">0</span><small>%</small></div>
      <div class="pl-line"><i></i></div>
      <div class="pl-text" data-i18n="loader.text"></div>
    </div>
  </div>
  <div id="site-header"></div>

  <main>
    <!-- ============ HERO ============ -->
    <section class="hero">
      <div class="hero-bg">
        <video class="hero-bg-video" autoplay muted loop playsinline preload="auto" data-fallback="assets/video/hero-poster.webp" poster="assets/video/hero-poster.webp">
          <source src="assets/video/hero.mp4" type="video/mp4">
        </video>
      </div>
      <div class="hero-overlay"></div>
      <div class="film-grain" aria-hidden="true"></div>

      <div class="container hero-grid">
        <div class="hero-content">
          <span class="eyebrow" data-i18n="hero.eyebrow"></span>
          <h1 class="hero-title">
            <span class="split-line"><span class="split" data-i18n="hero.t1"></span></span>
            <span class="split-line serif"><span class="split" data-i18n="hero.t2"></span></span>
            <span class="split-line"><span class="split" data-i18n="hero.t3"></span></span>
          </h1>
          <p class="hero-sub" data-i18n="hero.sub"></p>
          <div class="hero-ctas">
            <a href="villas.html" class="btn btn-light magnetic"><span data-i18n="hero.cta1"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
            <button class="btn btn-ghost magnetic" data-wa><span class="wa-inline"></span><span data-i18n="hero.cta2"></span></button>
          </div>
        </div>

        <div class="hero-visual">
          <a class="hero-chip" id="hero-chip" href="villa.html?id=1"></a>
          <div class="hero-badge" aria-hidden="true">
            <svg viewBox="0 0 200 200"><defs><path id="circ" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs><text><textPath href="#circ" data-i18n="hero.badge"></textPath></text></svg>
            <img src="assets/img/logo.jpg" alt="">
          </div>
        </div>
      </div>

      <div class="container hero-bottom">
        <form class="hero-search" id="hero-search">
          <div class="hs-field"><label for="hs-country" data-i18n="search.where"></label><select id="hs-country"></select></div>
          <div class="hs-field"><label for="hs-type" data-i18n="search.type"></label><select id="hs-type"></select></div>
          <div class="hs-field"><label for="hs-guests" data-i18n="search.guests"></label><select id="hs-guests"></select></div>
          <button class="btn btn-light" type="submit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span data-i18n="search.btn"></span></button>
        </form>
        <div class="hero-scroll"><i></i><span data-i18n="hero.scroll"></span></div>
      </div>
    </section>

    <!-- ============ MARQUEE ============ -->
    <div class="marquee"><div class="marquee-track"></div></div>

    <!-- ============ STATEMENT + INTRO ============ -->
    <section class="section statement-sec">
      <div class="container">
        <span class="eyebrow reveal" data-i18n="intro.eyebrow"></span>
        <p class="statement hl" data-i18n="statement"></p>
      </div>
      <div class="container intro">
        <div class="intro-visual">
          <div class="iv-main reveal-clip"><div data-parallax="-0.06" style="background-image:url('assets/img/villas/salvia.webp')"></div></div>
          <div class="iv-small reveal-clip" data-delay="250"><div data-parallax="0.05" style="background-image:url('assets/img/villas/interior-garden.webp')"></div></div>
          <div class="iv-card reveal" data-delay="500"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4"/></svg></span><b data-i18n="intro.card1"></b></div>
        </div>
        <div class="intro-text">
          <h2 class="section-title split-reveal"><span class="split" data-i18n="intro.title"></span></h2>
          <p class="reveal" data-i18n="intro.p1"></p>
          <p class="reveal" data-delay="100" data-i18n="intro.p2"></p>
          <div class="stats-inline reveal" data-delay="200">
            <div><b><span class="counter" id="stat-deals" data-to="0">0</span>+</b><span data-i18n="stats.deals"></span></div>
            <div><b><span class="counter" id="stat-countries" data-to="0">0</span></b><span data-i18n="stats.countries"></span></div>
            <div><b><span class="counter" id="stat-villas" data-to="0">0</span>+</b><span data-i18n="stats.villas"></span></div>
          </div>
          <a href="about.html" class="link-arrow reveal" data-delay="300"><span data-i18n="intro.cta"></span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </section>

    <!-- ============ HORIZONTAL SHOWCASE ============ -->
    <section class="hscroll">
      <div class="hs-sticky">
        <div class="container hs-head">
          <div>
            <span class="eyebrow" data-i18n="featured.eyebrow"></span>
            <h2 class="section-title" data-i18n="featured.title"></h2>
          </div>
          <div class="hs-hint"><span data-i18n="featured.hint"></span><div class="hs-bar"><i></i></div></div>
        </div>
        <div class="hs-track" id="hs-track"></div>
      </div>
    </section>

    <!-- ============ EXPERIENCE (VIDEO) ============ -->
    <section class="section experience">
      <div class="container exp-grid">
        <div class="exp-visual reveal-clip">
          <video autoplay muted loop playsinline preload="metadata" data-fallback="assets/video/villa-poster.webp" poster="assets/video/villa-poster.webp">
            <source src="assets/video/villa.mp4" type="video/mp4">
          </video>
          <div class="film-grain" aria-hidden="true"></div>
        </div>
        <div class="exp-text">
          <span class="eyebrow reveal" data-i18n="exp.eyebrow"></span>
          <h2 class="section-title split-reveal"><span class="split" data-i18n="exp.title"></span></h2>
          <p class="reveal" data-i18n="exp.text"></p>
          <ul class="exp-list">
            <li class="reveal" data-delay="0"><i></i><span data-i18n="exp.l1"></span></li>
            <li class="reveal" data-delay="100"><i></i><span data-i18n="exp.l2"></span></li>
            <li class="reveal" data-delay="200"><i></i><span data-i18n="exp.l3"></span></li>
            <li class="reveal" data-delay="300"><i></i><span data-i18n="exp.l4"></span></li>
          </ul>
          <button class="btn btn-dark magnetic reveal" data-delay="400" data-wa><span class="wa-inline"></span><span data-i18n="hero.cta2"></span></button>
        </div>
      </div>
    </section>

    <!-- ============ DESTINATIONS ============ -->
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow reveal" data-i18n="dest.eyebrow"></span>
            <h2 class="section-title split-reveal"><span class="split" data-i18n="dest.title"></span></h2>
          </div>
          <p class="section-sub reveal" data-i18n="dest.sub"></p>
        </div>
        <div class="bento" id="dest-bento"></div>
      </div>
    </section>

    <!-- ============ SERVICES ============ -->
    <section class="section services">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow reveal" data-i18n="services.eyebrow"></span>
            <h2 class="section-title split-reveal"><span class="split" data-i18n="services.title"></span></h2>
          </div>
        </div>
        <div class="svc-grid" id="svc-grid"></div>
      </div>
    </section>

    <!-- ============ STEPS ============ -->
    <section class="section">
      <div class="container">
        <div class="section-head center">
          <div>
            <span class="eyebrow reveal" data-i18n="steps.eyebrow"></span>
            <h2 class="section-title split-reveal"><span class="split" data-i18n="steps.title"></span></h2>
          </div>
        </div>
        <div class="steps line-reveal">
          <div class="steps-line"></div>
          <div class="step"><div class="step-num">01</div><h3 data-i18n="st1.t"></h3><p data-i18n="st1.d"></p></div>
          <div class="step"><div class="step-num">02</div><h3 data-i18n="st2.t"></h3><p data-i18n="st2.d"></p></div>
          <div class="step"><div class="step-num">03</div><h3 data-i18n="st3.t"></h3><p data-i18n="st3.d"></p></div>
          <div class="step"><div class="step-num">04</div><h3 data-i18n="st4.t"></h3><p data-i18n="st4.d"></p></div>
        </div>
      </div>
    </section>

    <!-- ============ TESTIMONIALS ============ -->
    <section class="section" style="padding-top:0">
      <div class="container testi-wrap">
        <div>
          <span class="eyebrow reveal" data-i18n="testi.eyebrow"></span>
          <h2 class="section-title split-reveal"><span class="split" data-i18n="testi.title"></span></h2>
          <div class="testi-nav reveal">
            <button class="arrow" id="testi-prev" aria-label="Previous"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
            <button class="arrow" id="testi-next" aria-label="Next"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
            <div id="testi-dots"></div>
          </div>
        </div>
        <div class="testi-track reveal" id="testi-track"></div>
      </div>
    </section>

    <!-- ============ CTA ============ -->
    <section class="container">
      <div class="cta-band reveal-clip">
        <div class="cta-bg" data-parallax="0.12" style="background-image:url('assets/img/villas/salvia.webp')"></div>
        <span class="eyebrow" data-i18n="footer.contact"></span>
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <button class="btn btn-wa magnetic" data-wa><span class="wa-inline"></span><span data-i18n="cta.btn"></span></button>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js?v=202611222101"></script>
  <script src="assets/js/data.js?v=202611222101"></script>
  <script src="assets/js/i18n-pt-uk.js?v=202611222101"></script>
  <script src="assets/js/main.js?v=202611222101"></script>
  <script src="assets/js/pages.js?v=202611222101"></script>
</body>
</html>
