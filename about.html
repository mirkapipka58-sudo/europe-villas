<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About | Europe Villas & Apartments</title>
  <meta name="theme-color" content="#08111f">
  <link rel="icon" href="assets/img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=202611222101">
</head>
<body data-page="about" data-title="meta.about">
  <div id="preloader"><div class="pl-panel top"></div><div class="pl-panel bottom"></div><div class="pl-inner"><img class="pl-logo" src="assets/img/logo.jpg" alt=""><div class="pl-count"><span class="pl-num">0</span><small>%</small></div><div class="pl-line"><i></i></div><div class="pl-text" data-i18n="loader.text"></div></div></div>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="ph-bg" data-parallax="0.25" style="background-image:url('assets/img/villas/eterna.webp'), var(--grad-deep)"></div>
      <div class="ph-overlay"></div>
      <div class="container ph-content">
        <span class="eyebrow reveal" data-i18n="ab.eyebrow"></span>
        <h1 class="ph-title split-reveal"><span class="split" data-i18n="ab.title"></span></h1>
        <p class="ph-sub reveal" data-delay="200" data-i18n="ab.sub"></p>
      </div>
      <svg class="ph-wave" viewBox="0 0 1440 70" preserveAspectRatio="none"><path fill="currentColor" d="M0,40 C240,80 480,0 720,30 C960,60 1200,10 1440,40 L1440,70 L0,70 Z"/></svg>
    </section>

    <section class="section">
      <div class="container about-grid">
        <div class="about-img reveal-clip"><div data-parallax="-0.06" style="background-image:url('assets/img/villas/velara.webp'), var(--grad-deep)"></div></div>
        <div class="about-text">
          <span class="eyebrow reveal" data-i18n="ab.story.eyebrow"></span>
          <h2 class="section-title split-reveal"><span class="split" data-i18n="ab.story.title"></span></h2>
          <p class="reveal" data-i18n="ab.story.p1"></p>
          <p class="reveal" data-delay="100" data-i18n="ab.story.p2"></p>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container stats">
        <div class="stat reveal"><div class="stat-num"><span class="counter" data-to="3500">0</span><sup>+</sup></div><p data-i18n="stats.deals"></p></div>
        <div class="stat reveal" data-delay="100"><div class="stat-num"><span class="counter" data-to="20">0</span></div><p data-i18n="stats.countries"></p></div>
        <div class="stat reveal" data-delay="200"><div class="stat-num"><span class="counter" data-to="120">0</span><sup>+</sup></div><p data-i18n="stats.villas"></p></div>
        <div class="stat reveal" data-delay="300"><div class="stat-num">24/7</div><p data-i18n="stats.support"></p></div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <div>
            <span class="eyebrow reveal" data-i18n="ab.values.eyebrow"></span>
            <h2 class="section-title split-reveal"><span class="split" data-i18n="ab.values.title"></span></h2>
          </div>
        </div>
        <div class="values" id="values-grid"></div>
      </div>
    </section>

    <section class="section services">
      <div class="container" style="position:relative">
        <div class="section-head">
          <div>
            <span class="eyebrow reveal" data-i18n="services.eyebrow"></span>
            <h2 class="section-title split-reveal"><span class="split" data-i18n="services.title"></span></h2>
          </div>
        </div>
        <div class="svc-grid" id="svc-grid"></div>
      </div>
    </section>

    <section class="container" style="margin-top:clamp(80px,10vw,140px)">
      <div class="cta-band reveal-clip">
        <div class="cta-bg" data-parallax="0.12" style="background-image:url('assets/img/villas/salvia.webp')"></div><span class="eyebrow" data-i18n="footer.contact"></span>
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <button class="btn btn-wa magnetic" data-wa><span class="wa-inline"></span><span data-i18n="cta.btn"></span></button>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js?v=202611222101"></script>
  <script src="assets/js/data.js?v=202611222101"></script>
  <script src="assets/js/i18n-pt-uk.js?v=202611222101"></script>
  <script src="assets/js/main.js?v=202611222101"></script>
  <script src="assets/js/pages.js?v=202611222101"></script>
</body>
</html>
